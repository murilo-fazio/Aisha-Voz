# ==============================================================================
# Sobreposicao OPCIONAL: publica no host as portas internas da stack.
# ==============================================================================
# O docker-compose.yml padrao publica apenas a porta da aplicacao (8080). Este
# arquivo reabre o Postgres e o servico de IA para a sua maquina, o que e
# necessario em dois casos:
#
#   1. rodar o Spring Boot pela IDE contra as dependencias containerizadas —
#      nesse modo o Java esta fora da rede do compose e precisa do banco
#      publicado no host (e o que o `make up` faz);
#   2. inspecionar o banco com DBeaver/psql, ou chamar o ai-service direto
#      com curl para depurar.
#
# Nao e carregado sozinho. Uso:
#     docker compose -f docker-compose.yml -f docker-compose.tools.yml up -d
# ou, mais simples:
#     make up          (dependencias + estas portas)
#     make up-full-tools  (stack inteira + estas portas)
#
# Em uso normal, prefira `make up-full`: uma porta so, menos superficie exposta.
# ==============================================================================

services:

  postgres:
    ports:
      # Mude POSTGRES_PORT no .env se a 5432 ja estiver ocupada por um Postgres
      # instalado na maquina — foi o caso aqui, por isso o padrao e 5433.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  ai-service:
    ports:
      # 127.0.0.1 por padrao: o servico gasta credito do OpenRouter e o unico
      # controle de acesso dele e o AI_INTERNAL_TOKEN. Para alcancar da rede
      # local (testar pelo celular, por exemplo), defina AI_BIND=0.0.0.0 no
      # .env — e so em rede confiavel.
      - "${AI_BIND:-127.0.0.1}:${AI_PORT:-5000}:5000"
