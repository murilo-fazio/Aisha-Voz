# ==============================================================================
# Aisha — nginx de producao
#
# Caminho do trafego:  navegador ─HTTPS─▶ Cloudflare ─tunel─▶ cloudflared
#                      ─HTTP─▶ nginx:80 ─HTTP─▶ app:8080
#
# Sem 'ssl' aqui: o certificado e da Cloudflare. Este servidor so e alcancavel
# pela rede interna do compose (nenhuma porta publicada no host).
# ==============================================================================

# ── IP real do visitante ─────────────────────────────────────────────────────
# Pelo tunel, $remote_addr e sempre o container do cloudflared — limitar por ele
# colocaria todo mundo no mesmo balde. A Cloudflare informa o IP original em
# CF-Connecting-IP e sobrescreve o valor que o cliente tentar mandar, entao ele
# e confiavel aqui, onde ninguem chega sem passar pela Cloudflare.
map $http_cf_connecting_ip $visitante {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# ── Limites de requisicao ────────────────────────────────────────────────────
# Login e cadastro: o freio por e-mail do Java nao pega quem testa uma senha
# contra muitos e-mails; este pega por IP.
limit_req_zone $visitante zone=auth:10m rate=10r/m;
# Chat: cada mensagem custa credito no OpenRouter. 20 por minuto e muito mais
# do que uma pessoa conversando escreve, e pouco para um script.
limit_req_zone $visitante zone=chat:10m rate=20r/m;
# Voz: STT + TTS consomem credito; limite por IP para reduzir abuso.
limit_req_zone $visitante zone=voice:10m rate=30r/m;
# Todo o resto (paginas, CSS, JS).
limit_req_zone $visitante zone=geral:10m rate=10r/s;

limit_req_status 429;

upstream aisha_app {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Um endereco so: www.dominio vira dominio, para o cookie de sessao e os
    # links nao se dividirem entre os dois. Le o host da requisicao, entao o
    # dominio nao fica escrito aqui.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Margem para o envio de audio que vira com a conversa por voz.
    client_max_body_size 11m;

    # Nao anunciar a versao do nginx nas respostas e paginas de erro.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Cabecalhos de seguranca ─────────────────────────────────────────────
    # 'always' para valerem tambem nas respostas de erro.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Microfone LIBERADO para o proprio site: e o canal principal da conversa
    # por voz. Camera e localizacao ficam negadas.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # HSTS curto (1 dia) enquanto o dominio e novo; suba para 31536000 quando
    # o HTTPS estiver estavel, porque o navegador memoriza a regra.
    add_header Strict-Transport-Security "max-age=86400" always;

    # ── Cabecalhos para o Spring ────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $visitante;
    proxy_set_header X-Forwarded-For $visitante;
    # A Cloudflare sempre atende em HTTPS; e isso que o Spring precisa saber
    # para gerar URLs e tratar o cookie seguro.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location = /login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://aisha_app;
    }

    location = /register {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://aisha_app;
    }

    location /api/chat {
        limit_req zone=chat burst=10 nodelay;
        # A IA tem ate 60s no Java (AI_READ_TIMEOUT_SECONDS); folga por cima.
        proxy_read_timeout 90s;
        proxy_pass http://aisha_app;
        # O chat.js mostra o campo "response" do JSON. Sem isto, o 429 viria
        # como pagina HTML e a pessoa leria "Erro HTTP 429".
        error_page 429 = @chat_limite;
    }

    location /api/voice/ {
        limit_req zone=voice burst=10 nodelay;
        # STT/TTS podem demorar mais que uma resposta de chat.
        proxy_read_timeout 180s;
        proxy_pass http://aisha_app;
        error_page 429 = @voice_limite;
    }

    location @voice_limite {
        default_type application/json;
        return 429 '{"error":"Muitas requisicoes de voz em pouco tempo. Aguarde um instante e tente novamente."}';
    }

    location @chat_limite {
        default_type application/json;
        return 429 '{"response":"Muitas mensagens seguidas. Espere um minutinho e tente de novo."}';
    }

    # Arquivos estaticos mudam a cada deploy e nao tem hash no nome: cache
    # curto, para uma versao nova chegar logo.
    location ~ ^/(css|js)/ {
        limit_req zone=geral burst=50 nodelay;
        expires 1h;
        proxy_pass http://aisha_app;
    }

    location / {
        limit_req zone=geral burst=30 nodelay;
        proxy_pass http://aisha_app;
    }
}
