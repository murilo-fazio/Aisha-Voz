# ==========================================================================
# Configuracao usada SOMENTE nos testes.
#
# Este arquivo esta em src/test/resources e, no classpath de teste, o
# target/test-classes vem antes do target/classes. Ou seja: ele SUBSTITUI por
# completo o application.properties de producao, nao se soma a ele. Por isso
# tudo que o contexto precisa tem de estar repetido aqui.
#
# O banco vem de um container Postgres efemero (Testcontainers): a anotacao
# @ServiceConnection no teste injeta url, usuario e senha em tempo de execucao,
# entao nao ha datasource declarado aqui. Ate a Fase 1 este arquivo excluia as
# autoconfiguracoes de JPA para rodar sem banco; com entidades e repositorios
# de verdade isso deixou de ser possivel, e um banco real passou a valer mais:
# cada execucao confere tambem as migracoes do Flyway e o ddl-auto=validate.
# ==========================================================================

spring.application.name=mini-login-json

# O Flyway roda no banco efemero: e ele quem cria o esquema que o Hibernate
# valida em seguida. E a mesma sequencia da aplicacao real.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# Integracao com a IA
#
# Valores de fachada: nenhum teste deste conjunto faz chamada de rede.
# --------------------------------------------------------------------------
app.ai.base-url=http://localhost:5000
app.ai.internal-token=
app.ai.timeout.connect=1
app.ai.timeout.read=2

spring.thymeleaf.cache=false

# Freio de tentativas: os mesmos numeros de producao, para os testes exercerem
# o comportamento real.
app.login.max-failures=5
app.login.lock-minutes=15
