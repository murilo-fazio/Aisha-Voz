# ==========================================================================
# Configuracao base da aplicacao Aisha (perfil padrao = desenvolvimento local)
#
# Regra: nada de valor hardcoded aqui. Tudo vem de variavel de ambiente, com
# default voltado para o dev que roda o Spring pela IDE contra as dependencias
# containerizadas (Postgres e ai-service publicados em localhost pelo compose).
#
# Regra de ouro sobre segredos: variavel obrigatoria NAO tem default. Se ela
# faltar, o placeholder nao resolve e o boot falha dizendo qual variavel falta.
# Nunca colocamos senha, token ou chave de verdade neste arquivo.
# ==========================================================================

spring.application.name=mini-login-json

# --------------------------------------------------------------------------
# Servidor HTTP
# --------------------------------------------------------------------------
server.port=${APP_PORT:8080}

# Id de sessao trafega apenas em cookie. Sem isto o container reescreve a URL
# com ";jsessionid=..." na primeira resposta depois do login (quando ainda nao
# sabe se o cliente aceita cookies), expondo o id da sessao no historico do
# navegador, em logs de proxy e no header Referer enviado a terceiros.
server.servlet.session.tracking-modes=cookie

# --------------------------------------------------------------------------
# Sessao e cookie
#
# Sem timeout configurado o padrao do container e 30 minutos, mas contar com
# um padrao implicito para uma decisao de seguranca e frageis: aqui esta
# escrito.
# --------------------------------------------------------------------------
server.servlet.session.timeout=30m

# JavaScript nao le o cookie de sessao: um XSS deixa de conseguir roubar a
# sessao so por ler document.cookie.
server.servlet.session.cookie.http-only=true

# SameSite=Lax: o navegador nao envia o cookie em POST vindo de outro site,
# que e o vetor do CSRF, mas continua enviando quando a pessoa CLICA num link
# para ca — com Strict, chegar por um link externo pareceria deslogado.
# Isto reforca o CsrfTokenInterceptor; nao substitui, porque navegador antigo
# ignora o atributo.
server.servlet.session.cookie.same-site=lax

# Cookie so por HTTPS. Fica desligado por padrao porque o ambiente local roda
# em http://localhost, onde 'secure' impediria o navegador de mandar o cookie
# e ninguem conseguiria entrar. Ligue (SESSION_COOKIE_SECURE=true) em qualquer
# lugar servido por HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Atras de proxy (producao: Cloudflare -> nginx -> app) o Spring recebe HTTP
# puro. Com 'framework' ele le os cabecalhos X-Forwarded-* e sabe que a
# requisicao original era HTTPS. Fica 'none' por padrao: sem proxy na frente,
# confiar nesses cabecalhos deixaria qualquer cliente fingir outro host.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# --------------------------------------------------------------------------
# Banco de dados (Postgres)
#
# Dentro do Docker o compose injeta SPRING_DATASOURCE_URL apontando para o host
# interno 'postgres'. Fora do Docker vale o default abaixo, que fala com a porta
# publicada no host pelo servico postgres do compose.
#
# POSTGRES_PASSWORD e obrigatoria e de proposito NAO tem default: sem ela a
# aplicacao falha no boot em vez de subir quebrada.
# --------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:aisha}}
spring.datasource.username=${POSTGRES_USER:aisha}
spring.datasource.password=${POSTGRES_PASSWORD}

# --------------------------------------------------------------------------
# JPA / Hibernate
#
# IMPORTANTE: o dono do esquema do banco e o Flyway, nunca o Hibernate.
# ddl-auto=validate faz o Hibernate apenas CONFERIR se o esquema criado pelas
# migracoes bate com os mapeamentos das entidades. Ele nao cria, nao altera e
# nao apaga nada. Jamais troque este valor por update/create/create-drop: isso
# tiraria o controle do esquema das migracoes versionadas e o Python, que e
# consumidor do mesmo banco, passaria a ver um esquema imprevisivel.
# --------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# Fecha a sessao do Hibernate ao fim da transacao, e nao no fim da requisicao:
# evita lazy loading escondido dentro do render do Thymeleaf.
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# Flyway (migracoes de esquema)
#
# O diretorio db/migration pode comecar vazio: neste caso o Flyway apenas cria
# sua tabela de historico (flyway_schema_history) e segue em frente.
# --------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------------------------
# Integracao com o servico de IA (Flask)
#
# Dentro do Docker o compose injeta AI_SERVICE_URL=http://ai-service:5000.
# Fora do Docker vale o default, que usa a porta publicada no host.
# AI_INTERNAL_TOKEN e segredo: nao ha valor real aqui. O default vazio existe
# so para o ambiente local ainda nao autenticado; quem consome deve tratar o
# vazio como "sem token".
# --------------------------------------------------------------------------
app.ai.base-url=${AI_SERVICE_URL:http://localhost:5000}
app.ai.internal-token=${AI_INTERNAL_TOKEN:}
# Timeouts em SEGUNDOS (numero inteiro puro, sem sufixo de unidade).
app.ai.timeout.connect=${AI_CONNECT_TIMEOUT_SECONDS:5}
app.ai.timeout.read=${AI_READ_TIMEOUT_SECONDS:150}

# Upload de audio para transcricao (limite alinhado ao Flask).
spring.servlet.multipart.max-file-size=${VOICE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${VOICE_MAX_REQUEST_SIZE:11MB}

# --------------------------------------------------------------------------
# Thymeleaf
# --------------------------------------------------------------------------
spring.thymeleaf.cache=false

# --------------------------------------------------------------------------
# Freio de tentativas de login (LoginAttemptService)
#
# Depois de max-failures senhas erradas, o e-mail fica bloqueado por
# lock-minutes. Numeros baixos demais atrapalham quem apenas errou a senha;
# altos demais deixam a forca bruta viavel. 5 e 15 sao o meio termo comum.
# --------------------------------------------------------------------------
app.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
