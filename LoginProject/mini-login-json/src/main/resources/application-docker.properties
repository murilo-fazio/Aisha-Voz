# ==========================================================================
# Perfil 'docker' — ativado com SPRING_PROFILES_ACTIVE=docker no compose.
#
# Este arquivo e sobreposto ao application.properties (nao o substitui). Ele so
# troca os defaults de rede de "localhost" pelos nomes de host da rede interna
# do compose, para que subir o servico 'app' nao dependa de o compose lembrar
# de injetar SPRING_DATASOURCE_URL e AI_SERVICE_URL.
#
# Segredos (POSTGRES_PASSWORD, AI_INTERNAL_TOKEN, OPENROUTER_API_KEY) continuam
# vindo apenas do ambiente. Nenhum valor real mora aqui.
# ==========================================================================

# Dentro da rede do compose o banco atende no host 'postgres', porta 5432.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:aisha}}

# Dentro da rede do compose a IA atende no host 'ai-service', porta 5000.
app.ai.base-url=${AI_SERVICE_URL:http://ai-service:5000}

# Em container o template ja vem empacotado e nao muda: pode cachear.
spring.thymeleaf.cache=true
